name: astrbot_plugin_astral
display_name: Astral 记忆
desc: |
  装上之后，Bot 会记住群里的人和事：谁爱聊什么、约定过什么、上次说到哪儿——
  换个群也不失忆，说话像同一个人。所有平台、所有群共用同一份记忆，
  记忆就是几个 Markdown 文件，你随时能打开看、直接改。
  兼容 AstrBot 4.27.0 到 4.x（5.0 之前）：补丁绑定的工作区解析入口自 4.27.0 起没变过，
  但只在 4.29.4 上完整实测；升级 AstrBot 后先跑一次 /astral status 确认是否生效，漂移会显式报错。
short_desc: 让 Bot 记住群里的人和事：所有群共用一份记忆，说话像同一个人
version: 1.0.0
author: ChakerAt
repo: https://github.com/cha-at/astral
astrbot_version: ">=4.27.0,<5"
category: AI 增强
