name: astrbot_plugin_astral
display_name: Astral 记忆
desc: |
  装上之后，Bot 会记住群里的人和事：谁爱聊什么、约定过什么、上次说到哪儿——
  换个群也不失忆，说话像同一个人。所有平台、所有群共用同一份记忆，
  记忆就是几个 Markdown 文件，你随时能打开看、直接改。
  只适配 AstrBot 4.29.x；其它版本在插件市场会显示"不支持"（补丁绑定了具体源码位置，这是故意的）。
short_desc: 让 Bot 记住群里的人和事：所有群共用一份记忆，说话像同一个人
version: 1.0.0
author: ChakerAt
