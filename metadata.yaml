name: astrbot_plugin_astral
display_name: Astral 记忆工作区
desc: |
  Bot 将会记住群里的人和事：谁爱聊什么、约定过什么、上次说到哪儿——
  换个群也不失忆，说话像同一个人。所有平台、所有群共用同一份记忆，
  基于 Markdown，你随时能打开看、直接改。
  还能用 /astral commit 存档、/astral recover 回退。
  开发版本为 4.29.4，其它版本还未实机测试。
short_desc: 让 Bot 记住群里的人和事：所有群共用一份记忆，说话像同一个人
